server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: waimai-order
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/waimai;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    time-zone: Asia/Shanghai

app:
  admin-password: admin123
  admin-token: waimai-admin-demo-token
